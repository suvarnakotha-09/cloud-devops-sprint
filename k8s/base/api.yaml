apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-devops-api
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: cloud-devops-api
    app.kubernetes.io/part-of: cloud-devops-sprint
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-devops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-devops-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: cloud-devops-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-devops-api
  namespace: devops-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloud-devops-api
  ports:
    - name: http
      port: 80
      targetPort: http
