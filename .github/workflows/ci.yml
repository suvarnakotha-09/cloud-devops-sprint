name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate deployment script
        run: bash -n scripts/deploy-local.sh

      - name: Build Docker image
        run: docker build -t cloud-devops-api:${{ github.sha }} app
